services:
  review-assignment:
    build: .
    container_name: review-assignment
    ports:
      - "8000:8000"
    volumes:
      - review-data:/data
    environment:
      # 首次启动自动写入演示数据；设为 "0" 可得到空库
      SEED_DEMO: "1"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/state')"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  review-data:
